name: Test

on:
  # run workflow manually
  workflow_dispatch:

  # trigger: push new changes
  push:
    branches: [main]

jobs:
  start:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      LOCKED_OUT_USERNAME: ${{ secrets.LOCKED_OUT_USERNAME }}
      PROBLEM_USERNAME: ${{ secrets.PROBLEM_USERNAME }}
      PERFORMANCE_GLITCH_USERNAME: ${{ secrets.PERFORMANCE_GLITCH_USERNAME }}
      ERROR_USERNAME: ${{ secrets.ERROR_USERNAME }}
      VISUAL_USERNAME: ${{ secrets.VISUAL_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
